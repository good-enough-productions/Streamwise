name: Build & Deploy to Phone

# Runs on every push to main, or manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # IMPORTANT: This must run on your local Windows machine (self-hosted runner)
    # because ADB needs to reach your phone on the local Wi-Fi network.
    # See README.md → "CI/CD Setup" for runner installation instructions.
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build setup ─────────────────────────────────────────────────────────

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode debug keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content debug.keystore.base64 -Raw).Trim())
          [IO.File]::WriteAllBytes("$PWD\debug.keystore", $bytes)

      - name: Create .env file
        shell: pwsh
        run: |
          "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" | Set-Content .env
          "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"    | Add-Content .env

      # ── Compile ──────────────────────────────────────────────────────────────

      - name: Build debug APK
        shell: pwsh
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── Deploy via ADB wireless ──────────────────────────────────────────────
      # The self-hosted runner is your local Windows PC, which stays paired to
      # your phone via Android Wireless Debugging (mDNS/TLS). No manual IP
      # variables needed — ADB discovers the device automatically.
      # One-time setup: enable Wireless Debugging on phone and run:
      #   adb pair <ip>:<pair-port>   (enter the 6-digit code shown on screen)

      - name: Find ADB and verify phone is connected
        shell: pwsh
        run: |
          # Locate ADB from ANDROID_HOME or the well-known Android Studio path
          $adb = if ($env:ANDROID_HOME) {
            Join-Path $env:ANDROID_HOME "platform-tools\adb.exe"
          } else {
            "$env:LOCALAPPDATA\Android\Sdk\platform-tools\adb.exe"
          }
          if (-not (Test-Path $adb)) { Write-Error "adb.exe not found at $adb"; exit 1 }
          Write-Output "Using ADB: $adb"
          echo "ADB_PATH=$adb" >> $env:GITHUB_ENV

          $devices = & $adb devices
          Write-Output $devices
          # Expect at least one non-header device line
          $connected = ($devices -split "`n") | Where-Object { $_ -match "device$" }
          if (-not $connected) {
            Write-Error "No phone found. Ensure Wireless Debugging is on and the phone is on the same network."
            exit 1
          }
          # Grab the serial of the first connected device for subsequent steps
          $serial = ($connected[0] -split "\s+")[0].Trim()
          Write-Output "Deploying to: $serial"
          echo "ADB_SERIAL=$serial" >> $env:GITHUB_ENV

      - name: Install APK on phone
        shell: pwsh
        run: |
          & "$env:ADB_PATH" -s "$env:ADB_SERIAL" install -r `
            app/build/outputs/apk/debug/app-debug.apk

      - name: Launch app on phone
        shell: pwsh
        run: |
          & "$env:ADB_PATH" -s "$env:ADB_SERIAL" shell am start `
            -n "com.aistudio.streammanager.qpwoei/com.example.MainActivity"
